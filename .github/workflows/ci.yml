# 결정적 CI. AI와 secret을 쓰지 않는다. PR과 main push마다 Python 검사, 빌드, import 목록,
# 공리 감사, 블루프린트 Lean 이름을 확인한다.
# 브랜치 보호의 필수 상태 검사 이름은 job 이름 "Lean CI"다. 이름을 바꾸면 보호 설정도 바꿔야 한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    name: Lean CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Mathlib 캐시(약 5GB)와 .lake 캐시를 풀 자리를 만든다.
      - name: 디스크 공간 확보
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Lean이 필요 없는 검사를 먼저 돌려 빨리 실패하게 한다.
      - name: Python 검사
        run: |
          python3 -I scripts/ci_test_blueprint_decls.py
          python3 -I scripts/test_save_review.py
          python3 -I scripts/test_pr_review.py
          python3 -I scripts/check_definition.py
          python3 -I scripts/check_blueprint.py

      # Mathlib은 cache.mathlib.org의 미리 빌드된 olean을 받는다 (use-mathlib-cache 자동 감지).
      # lake build의 기본 대상에 KuratowskiAudit가 있어 공리 감사도 함께 빌드된다.
      # mk_all은 Kuratowski 라이브러리만 본다. KuratowskiAudit는 디렉터리가 없는 단일 파일 라이브러리라
      # 인자 없이 돌리면 실패한다.
      - name: 빌드와 import 목록
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          build: true
          test: false
          lint: false
          mk_all-check: true
          mk_all-args: --lib Kuratowski

      # GitHub 캐시에서 되살린 빌드는 감사 파일을 다시 elaborate하지 않을 수 있으므로,
      # 이번 커밋에서 감사가 실제로 돌았음을 보장하려고 감사 파일을 새로 실행한다.
      - name: 공리 감사 (새로 실행)
        run: lake env lean KuratowskiAudit.lean

      # TeX 없이 블루프린트의 \lean{...} 이름을 뽑아 Lean에 실제로 있는지 확인한다.
      - name: 블루프린트 Lean 이름 (checkdecls)
        run: |
          python3 -I scripts/ci_blueprint_decls.py --output "$RUNNER_TEMP/lean_decls"
          lake exe checkdecls "$RUNNER_TEMP/lean_decls"
