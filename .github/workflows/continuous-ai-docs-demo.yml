name: Continuous AI (docs-demo)
on:
  workflow_dispatch:
    inputs:
      batch:
        type: string
        default: auto
      retry_failed:
        type: boolean
        default: false
permissions: {}
concurrency:
  group: continuous-ai-docs-demo
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: Maokami/continuous-ai-kit/.github/workflows/scan-report.yml@55a5329192df029d909bdfbe8d936088dd16e2a0
    with:
      config: .github/continuous-ai/docs-demo.json
      default_branch: "main"
      batch: ${{ inputs.batch || 'auto' }}
      retry_failed: ${{ inputs.retry_failed || false }}
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
