name: Lean improvement

on:
  schedule:
    - cron: '23 21 * * 0' # 월요일 06:23 KST, 혼잡한 정각을 피한다.
  workflow_dispatch:
    inputs:
      batch:
        description: auto 또는 0부터 시작하는 묶음 번호 (4개 파일씩)
        type: string
        default: auto
      retry_failed:
        description: 지정 batch의 실패·중단을 한 번만 재시도
        type: boolean
        default: false

permissions: {}

concurrency:
  group: lean-improvement
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: Maokami/continuous-ai-kit/.github/workflows/scan-report.yml@d17b8cf395a9bc6fc48799850f4d80c72386e767
    with:
      config: .github/continuous-ai/lean.json
      default_branch: main
      batch: ${{ inputs.batch || 'auto' }}
      retry_failed: ${{ inputs.retry_failed || false }}
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
